# XcodeGen spec. Generate the project with `xcodegen` (see README.md).
# Before building, replace `com.yourcompany` and the app group with your own
# identifiers, and set DEVELOPMENT_TEAM.
name: Memori

options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Memori:
    type: application
    platform: iOS
    sources:
      - Memori
      - Shared
    info:
      path: Memori/Info.plist
      properties:
        CFBundleDisplayName: memori
        CFBundleDevelopmentRegion: ko
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Memori/Memori.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourcompany.memori
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.memori
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: MemoriWidget

  MemoriWidget:
    type: app-extension
    platform: iOS
    sources:
      - MemoriWidget
      - Shared
    info:
      path: MemoriWidget/Info.plist
      properties:
        CFBundleDisplayName: memori
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MemoriWidget/MemoriWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourcompany.memori
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.memori.widget
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  MemoriTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MemoriTests
    dependencies:
      - target: Memori

schemes:
  Memori:
    build:
      targets:
        Memori: all
    test:
      targets:
        - MemoriTests
